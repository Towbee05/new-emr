services:
  db:
    image: postgres:17
    container_name: emr_db
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  
  redis:
    image: redis
    container_name: emr_redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
    - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: emr_redis_insight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis



volumes:
  postgresql_data:
  redis_data:
  redisinsight_data: